<!--
  LOTV Prayer Care Package Intake - embeddable, dashboard-editable form
  =====================================================================
  Paste this whole file into a Duda "Embed Code" / HTML widget, or iframe
  https://lotv.wte.net/request-prayer-care-package (served by Lotv.Web as a
  normal page - a copy of this file lives in src/Lotv.Web/Forms and the Lotv.Web
  build keeps it in sync).

  THE QUESTIONS ARE NOT IN THIS FILE. On load it fetches its definition
  (questions, choices, show/hide rules, wording, donation box) from
    GET {API}/api/v1/public/forms/prayer-care-intake
  Staff edit that in the dashboard: left nav > Edit Request Form
  (HQAdmin). The built-in default definition lives in
  src/Lotv.Api/Data/FormDefaults/prayer-care-intake.json.

  This file only knows HOW to render a definition and how to map the standard
  answers onto the Family/PackageRequest the API creates
  (POST {API}/api/v1/public/apply). Custom questions staff add are appended to
  the family's contact notes.

  API_BASE_URL below is the production API (https://lotv_api.wte.net), or
  http://localhost:5100 when previewed locally. The API's default CORS policy
  allows any origin, so no AllowedOrigins change is needed for Duda.

  IFRAME AUTO-HEIGHT: when framed, this page posts {lotvIntakeHeight: <px>} to
  its parent whenever its height changes. Optional parent-side listener:
    window.addEventListener("message", function (e) {
      if (e.data && e.data.lotvIntakeHeight)
        document.getElementById("lotv-intake-frame").style.height = e.data.lotvIntakeHeight + "px";
    });
-->
<meta charset="utf-8" />
<style>
  #lotv-intake { max-width: 640px; margin: 0 auto; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f2a3d; }
  #lotv-intake * { box-sizing: border-box; }
  #lotv-intake h2 { font-size: 1.5rem; margin: 0 0 6px; color: #1f2a3d; }
  #lotv-intake .lotv-sub { color: #5a6b85; font-size: .92rem; margin: 0 0 24px; line-height: 1.5; }
  #lotv-intake .lotv-section { margin-bottom: 24px; }
  #lotv-intake .lotv-section-label { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #7a8aa3; margin: 10px 0 0; padding-bottom: 6px; border-bottom: 1px solid #e3e8f0; }
  #lotv-intake .lotv-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 24px; }
  #lotv-intake .lotv-full { grid-column: 1 / -1; }
  #lotv-intake label { display: block; font-size: .84rem; font-weight: 600; margin-bottom: 5px; color: #33415c; }
  #lotv-intake input, #lotv-intake select, #lotv-intake textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #d3dae6; border-radius: 8px;
    font-size: .92rem; font-family: inherit; background: #fff;
  }
  #lotv-intake input:focus, #lotv-intake select:focus, #lotv-intake textarea:focus { outline: 2px solid #4a7c59; outline-offset: 1px; }
  #lotv-intake .lotv-toggle-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 4px; }
  #lotv-intake .lotv-toggle {
    border: 2px solid #d3dae6; border-radius: 10px; padding: 16px; text-align: center;
    cursor: pointer; background: #fff; font-weight: 700; font-size: .92rem; color: #1f2a3d;
  }
  #lotv-intake .lotv-toggle.active { border-color: #4a7c59; background: #eef6ef; }
  #lotv-intake .lotv-hint { font-size: .76rem; color: #8291a8; margin-top: 4px; }
  #lotv-intake [hidden] { display: none !important; }
  #lotv-intake .lotv-donation {
    background: linear-gradient(135deg, #fef9ee, #fef3d0); border: 1px solid #e8c87a;
    border-radius: 12px; padding: 20px; margin: 8px 0 24px;
  }
  #lotv-intake .lotv-donation h3 { margin: 0 0 6px; font-size: 1rem; color: #7a5a00; }
  #lotv-intake .lotv-donation p { margin: 0 0 14px; font-size: .86rem; color: #9a7a20; line-height: 1.5; }
  #lotv-intake #lotv-givebutter-widget { min-height: 40px; }
  #lotv-intake .lotv-checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 0; font-size: .86rem; font-weight: 400; }
  #lotv-intake .lotv-checkbox-row input { width: auto; margin-top: 3px; }
  #lotv-intake button[type="submit"] {
    width: 100%; padding: 14px; border: 0; border-radius: 9px; background: #1f2a3d;
    color: #fff; font-weight: 700; font-size: .96rem; cursor: pointer;
  }
  #lotv-intake button[type="submit"]:disabled { opacity: .6; cursor: default; }
  #lotv-intake .lotv-error { background: #fff3cd; border-radius: 8px; padding: 12px 16px; font-size: .86rem; color: #856404; margin-bottom: 16px; }
  #lotv-intake .lotv-confirm { text-align: center; padding: 40px 20px; }
  #lotv-intake .lotv-confirm .lotv-emoji { font-size: 2.6rem; margin-bottom: 12px; }
  #lotv-intake .lotv-required { color: #c0392b; }
  #lotv-intake .lotv-bracelet-intro { font-size: .84rem; color: #5a6b85; line-height: 1.55; margin: 0 0 14px; }
  #lotv-intake .lotv-bracelet-row {
    display: grid; grid-template-columns: 90px 1fr 130px 150px 32px; gap: 10px;
    align-items: end; margin-bottom: 10px;
  }
  #lotv-intake .lotv-bracelet-row .lotv-col-label {
    font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    color: #8291a8; margin-bottom: 4px; display: block;
  }
  #lotv-intake .lotv-bracelet-row input, #lotv-intake .lotv-bracelet-row select { padding: 8px 9px; font-size: .86rem; }
  #lotv-intake .lotv-bracelet-remove {
    width: 32px; height: 36px; border: 1px solid #d3dae6; background: #fff; border-radius: 8px;
    color: #c0392b; font-weight: 700; cursor: pointer; font-size: .9rem; line-height: 1;
  }
  #lotv-intake .lotv-bracelet-remove:disabled { opacity: .35; cursor: default; }
  #lotv-intake .lotv-add-row-btn {
    border: 2px dashed #b9c6d9; background: transparent; color: #4a7c59; font-weight: 700;
    font-size: .84rem; padding: 9px 16px; border-radius: 8px; cursor: pointer; margin-top: 2px;
  }
  #lotv-intake .lotv-add-row-btn:hover { background: #f3f8f4; }
  @media (max-width: 560px) {
    #lotv-intake .lotv-grid { grid-template-columns: 1fr; }
    #lotv-intake .lotv-bracelet-row { grid-template-columns: 1fr 1fr; }
    #lotv-intake .lotv-bracelet-row > div:nth-child(2) { grid-column: 1 / -1; }
  }
</style>

<div id="lotv-intake">
  <p id="lotv-loading" class="lotv-sub">Loading form&hellip;</p>
  <div id="lotv-load-error" class="lotv-error" hidden></div>
  <form id="lotv-intake-form" novalidate hidden></form>
  <div id="lotv-confirm" class="lotv-confirm" hidden></div>
</div>

<script>
(function () {
  // ── CONFIG ──────────────────────────────────────────────────────────────
  // Production API; falls back to the local API when previewed on localhost.
  var API_BASE_URL = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
    ? "http://localhost:5100"
    : "https://lotv_api.wte.net";
  var FORM_KEY = "prayer-care-intake";

  var root = document.getElementById("lotv-intake");
  var form = document.getElementById("lotv-intake-form");
  var loadingEl = document.getElementById("lotv-loading");
  var loadErrorEl = document.getElementById("lotv-load-error");
  var confirmEl = document.getElementById("lotv-confirm");

  var def = null;          // the form definition from the API
  var forWho = "me";       // "me" | "someone"
  var byKey = {};          // field key -> definition
  var controls = {};       // field key -> input/select/textarea element
  var items = [];          // { f, wrap, labelEl }
  var errorBox, submitBtn;
  var braceletRowsEl, braceletIntroEl, braceletAddBtn, braceletField = null, braceletRowCount = 0;

  // ── tiny DOM helper (all definition text goes through textContent — never innerHTML) ──
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // ── iframe auto-height ──────────────────────────────────────────────────
  function postHeight() {
    if (window.parent === window) return;
    try { window.parent.postMessage({ lotvIntakeHeight: document.documentElement.scrollHeight }, "*"); } catch (e) {}
  }
  if (window.parent !== window && "ResizeObserver" in window) new ResizeObserver(postHeight).observe(document.body);

  // ── load the definition ─────────────────────────────────────────────────
  fetch(API_BASE_URL + "/api/v1/public/forms/" + FORM_KEY)
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) { def = d; build(); })
    .catch(function () {
      loadingEl.hidden = true;
      loadErrorEl.textContent = "This form is temporarily unavailable. Please try again in a few minutes.";
      loadErrorEl.hidden = false;
    });

  // Text that may differ for "me" / "someone else".
  function byBranch(f, base) {
    var v = forWho === "someone" ? f[base + "Someone"] : f[base + "Me"];
    return v || f[base] || "";
  }

  // ── build the form from the definition ──────────────────────────────────
  function build() {
    form.appendChild(el("h2", null, def.title));
    form.appendChild(el("p", "lotv-sub", def.intro));

    errorBox = el("div", "lotv-error"); errorBox.id = "lotv-error"; errorBox.hidden = true;
    form.appendChild(errorBox);

    // For me / for someone else
    var who = el("div", "lotv-section");
    who.appendChild(labelWithStar("lotv-section-label", def.whoIsThisForLabel, true));
    var tg = el("div", "lotv-toggle-group");
    [["me", def.toggleLabelMe], ["someone", def.toggleLabelSomeone]].forEach(function (p) {
      var t = el("div", "lotv-toggle" + (p[0] === "me" ? " active" : ""), p[1]);
      t.setAttribute("data-forwho", p[0]); t.setAttribute("role", "button"); t.tabIndex = 0;
      var activate = function () {
        forWho = p[0];
        tg.querySelectorAll(".lotv-toggle").forEach(function (o) { o.classList.toggle("active", o === t); });
        refresh();
      };
      t.addEventListener("click", activate);
      t.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); } });
      tg.appendChild(t);
    });
    who.appendChild(tg);
    form.appendChild(who);

    // Fields
    var grid = el("div", "lotv-grid");
    def.fields.forEach(function (f) { if (f.key) byKey[f.key] = f; });
    def.fields.forEach(function (f) {
      if (f.visible === false) return;
      var wrap = el("div", "lotv-item " + (f.width === "full" || f.type === "heading" || f.type === "hint" || f.type === "bracelet" ? "lotv-full" : "lotv-half"));
      wrap.id = "lotv-item-" + f.id;
      if ((f.showWhen || []).some(function (c) { return c.branch === "someone"; })) wrap.setAttribute("data-someone-only", "");
      var labelEl = null;

      if (f.type === "heading") {
        labelEl = el("div", "lotv-section-label"); labelEl.id = "lotv-" + f.id; wrap.appendChild(labelEl);
      } else if (f.type === "hint") {
        labelEl = el("div", "lotv-hint"); wrap.appendChild(labelEl);
      } else if (f.type === "bracelet") {
        braceletField = f; buildBracelet(wrap);
      } else if (f.type === "checkbox") {
        var row = el("label", "lotv-checkbox-row");
        var cb = document.createElement("input"); cb.type = "checkbox"; cb.id = "lotv-" + f.id; cb.name = f.key;
        controls[f.key] = cb; row.appendChild(cb);
        labelEl = el("span"); row.appendChild(labelEl); wrap.appendChild(row);
      } else {
        labelEl = el("label"); labelEl.setAttribute("for", "lotv-" + f.id); wrap.appendChild(labelEl);
        var c;
        if (f.type === "select") {
          c = document.createElement("select");
          var blank = el("option", null, "- Please select -"); blank.value = ""; c.appendChild(blank);
          (f.options || []).forEach(function (o) { var op = el("option", null, o.label); op.value = o.value; c.appendChild(op); });
        } else if (f.type === "textarea") {
          c = document.createElement("textarea"); c.rows = 4;
        } else {
          c = document.createElement("input"); c.type = f.type; // text | email | tel | date
        }
        c.id = "lotv-" + f.id; c.name = f.key;
        if (f.placeholder) c.setAttribute("placeholder", f.placeholder);
        controls[f.key] = c; wrap.appendChild(c);
        if (f.help) wrap.appendChild(el("div", "lotv-hint", f.help));
      }
      grid.appendChild(wrap);
      items.push({ f: f, wrap: wrap, labelEl: labelEl });
    });
    form.appendChild(grid);

    submitBtn = el("button", null, def.submitLabel); submitBtn.type = "submit"; submitBtn.id = "lotv-submit-btn";
    form.appendChild(submitBtn);
    if (def.footerNote) {
      var fn = el("p", null, def.footerNote);
      fn.style.cssText = "font-size:.76rem;color:#8291a8;text-align:center;margin:14px 0 0;line-height:1.6;";
      form.appendChild(fn);
    }

    form.addEventListener("input", refresh);
    form.addEventListener("change", refresh);
    form.addEventListener("submit", onSubmit);

    loadingEl.hidden = true; form.hidden = false;
    refresh();
    postHeight();
  }

  function labelWithStar(cls, text, star) {
    var d = el("div", cls, text + (star ? " " : ""));
    if (star) d.appendChild(el("span", "lotv-required", "*"));
    return d;
  }

  // ── visibility rules ────────────────────────────────────────────────────
  function rawValue(key) {
    var c = controls[key];
    if (!c) return "";
    return c.type === "checkbox" ? (c.checked ? "true" : "") : (c.value || "").trim();
  }

  function isActive(f, depth) {
    depth = depth || 0;
    if (depth > 12 || f.visible === false) return false;
    return (f.showWhen || []).every(function (c) {
      if (c.branch) return c.branch === forWho;
      if (c.field) {
        var src = byKey[c.field];
        if (!src || !isActive(src, depth + 1)) return false;
        var v = rawValue(c.field);
        if (c.notEmpty && !v) return false;
        if (c.in && c.in.length && c.in.indexOf(v) < 0) return false;
        return true;
      }
      return true;
    });
  }

  function value(key) { var f = byKey[key]; return f && isActive(f) ? rawValue(key) : ""; }

  function refresh() {
    items.forEach(function (it) {
      it.wrap.hidden = !isActive(it.f);
      if (it.labelEl) {
        var t = byBranch(it.f, "label");
        it.labelEl.textContent = t;
        if (it.f.required && it.f.type !== "heading" && it.f.type !== "hint" && it.f.type !== "checkbox") {
          it.labelEl.appendChild(document.createTextNode(" "));
          it.labelEl.appendChild(el("span", "lotv-required", "*"));
        }
      }
    });
    if (braceletField) {
      braceletIntroEl.textContent = byBranch(braceletField, "label");
      braceletAddBtn.textContent = byBranch(braceletField, "buttonLabel") || "+ Add Another Child";
    }
    postHeight();
  }

  // ── children-for-bracelet builder ───────────────────────────────────────
  function buildBracelet(wrap) {
    braceletIntroEl = el("p", "lotv-bracelet-intro"); braceletIntroEl.id = "lotv-bracelet-intro";
    braceletRowsEl = el("div"); braceletRowsEl.id = "lotv-bracelet-rows";
    braceletAddBtn = el("button", "lotv-add-row-btn"); braceletAddBtn.type = "button"; braceletAddBtn.id = "lotv-bracelet-add";
    braceletAddBtn.addEventListener("click", addBraceletRow);
    wrap.appendChild(braceletIntroEl); wrap.appendChild(braceletRowsEl); wrap.appendChild(braceletAddBtn);
    addBraceletRow();
  }

  function addBraceletRow() {
    braceletRowCount++;
    var row = el("div", "lotv-bracelet-row");
    function col(label, control) {
      var d = el("div"); d.appendChild(el("span", "lotv-col-label", label)); d.appendChild(control); return d;
    }
    var order = document.createElement("input"); order.type = "number"; order.min = 1; order.max = 10; order.className = "lotv-bracelet-order"; order.value = braceletRowCount;
    var initial = document.createElement("input"); initial.type = "text"; initial.className = "lotv-bracelet-initial"; initial.setAttribute("placeholder", "e.g. E.M.");
    var bead = document.createElement("select"); bead.className = "lotv-bracelet-bead";
    ["Initials", "Heart"].forEach(function (t) { bead.appendChild(el("option", null, t)); });
    var status = document.createElement("select"); status.className = "lotv-bracelet-status";
    ["Living", "Deceased", "In Heaven"].forEach(function (t) { status.appendChild(el("option", null, t)); });
    var rm = el("button", "lotv-bracelet-remove", "✕"); rm.type = "button"; rm.setAttribute("aria-label", "Remove this child");
    rm.addEventListener("click", function () { row.remove(); updateBraceletRemoveState(); });
    row.appendChild(col("Order", order)); row.appendChild(col("Child Initial", initial));
    row.appendChild(col("Bead Type", bead)); row.appendChild(col("Living or Deceased", status)); row.appendChild(rm);
    braceletRowsEl.appendChild(row);
    updateBraceletRemoveState();
    postHeight();
  }

  function updateBraceletRemoveState() {
    var rows = braceletRowsEl.querySelectorAll(".lotv-bracelet-row");
    rows.forEach(function (r) { r.querySelector(".lotv-bracelet-remove").disabled = rows.length <= 1; });
  }

  function getBraceletRows() {
    var rows = [];
    braceletRowsEl.querySelectorAll(".lotv-bracelet-row").forEach(function (r) {
      rows.push({
        order: r.querySelector(".lotv-bracelet-order").value || "",
        initial: r.querySelector(".lotv-bracelet-initial").value.trim(),
        bead: r.querySelector(".lotv-bracelet-bead").value,
        status: r.querySelector(".lotv-bracelet-status").value
      });
    });
    return rows;
  }

  function braceletHasContent() {
    return getBraceletRows().some(function (r) { return r.initial || r.bead === "Heart"; });
  }

  // ── submit ──────────────────────────────────────────────────────────────
  function showError(msg) { errorBox.textContent = "⚠ " + msg; errorBox.hidden = false; postHeight(); }
  function clearError() { errorBox.hidden = true; }
  function plainLabel(f) { return byBranch(f, "label").replace(/[:\s]+$/, ""); }
  function nameParts(full) {
    var parts = (full || "").trim().split(/\s+/);
    return { first: parts.shift() || "", last: parts.join(" ") };
  }

  // Collects every problem at once so visitors can fix them in one pass.
  function validate() {
    var missing = [], bad = [];
    for (var i = 0; i < def.fields.length; i++) {
      var f = def.fields[i];
      if (f.type === "heading" || f.type === "hint" || !isActive(f)) continue;
      if (f.type === "bracelet") {
        if (f.required && !braceletHasContent())
          missing.push("at least one child for the bracelet (initials, or a Heart bead if unnamed)");
        continue;
      }
      var v = rawValue(f.key);
      if (f.required && !v) { missing.push(plainLabel(f)); continue; }
      if (f.type === "email" && v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))
        bad.push("Please enter a valid email address for \"" + plainLabel(f) + "\".");
    }
    // The API needs a first AND last name for the primary contact.
    var husband = byKey.husbandFirst;
    if (husband && value("husbandFirst") && !nameParts(value("husbandFirst")).last)
      bad.push("Please enter both a first and last name for \"" + plainLabel(husband) + "\".");
    var msgs = [];
    if (missing.length) msgs.push("Please fill in: " + missing.join(", ") + ".");
    return msgs.concat(bad).join(" ") || null;
  }

  function buildPayload() {
    var h = nameParts(value("husbandFirst")), w = nameParts(value("wifeFirst"));
    var howHeard = value("howHeard") === "Other" ? ("Other: " + value("howHeardOther")) : value("howHeard");

    var storyParts = [];
    if (value("customMessage")) storyParts.push("Message to recipient: " + value("customMessage"));
    if (value("story")) storyParts.push(value("story"));

    var childrenInitials = "";
    if (braceletField && isActive(braceletField)) {
      childrenInitials = getBraceletRows()
        .filter(function (r) { return r.initial || r.bead === "Heart"; })
        .sort(function (a, b) { return (parseInt(a.order, 10) || 0) - (parseInt(b.order, 10) || 0); })
        .map(function (r) { return r.order + ". " + (r.initial || "(unnamed)") + " (" + r.bead + ", " + r.status + ")"; })
        .join("; ");
    }

    var family = {
      parent1FirstName: h.first, parent1LastName: h.last,
      parent2FirstName: w.first, parent2LastName: w.last,
      email: value("husbandEmail") || value("wifeEmail"),
      phone: value("husbandPhone") || value("wifePhone"),
      streetAddress: value("street"), apt: value("apt"),
      city: value("city"), state: value("state"), zip: value("zip"),
      reason: value("reason"),
      faithTradition: value("faithTradition"),
      childrenInitials: childrenInitials,
      story: storyParts.join("\n\n"),
      parishName: value("parish"), dioceseName: value("diocese"),
      howHeard: howHeard,
      chapterId: def.chapterId || 1,
      privacyPreference: forWho === "someone" ? (value("mentionPreference") === "Mention" ? "Public" : "Anonymous") : "Anonymous",
      dateOfLoss: value("dateOfLoss") || null
    };

    // Notes: grief support, any custom questions staff added, then opt-ins.
    var notes = [], optins = [];
    if (value("griefSupport")) notes.push("Quarterly Grief Support requested: " + value("griefSupport"));
    def.fields.forEach(function (f) {
      if (!isActive(f) || !f.key) return;
      if (f.type === "checkbox" && f.optinLabel) { if (rawValue(f.key)) optins.push(f.optinLabel); return; }
      if (f.standard) return;
      var v = rawValue(f.key);
      if (v) notes.push(plainLabel(f) + ": " + (f.type === "checkbox" ? "Yes" : v));
    });
    if (optins.length) notes.push("Opted in to: " + optins.join(", "));
    if (notes.length) family.contactNotes = notes.join(" | ");

    return {
      family: family,
      forSelf: forWho === "me",
      packageType: def.packageType || "Comfort",
      referrerFirstName: value("requesterFirst"),
      referrerLastName: value("requesterLast"),
      referrerEmail: value("requesterEmail")
    };
  }

  function onSubmit(e) {
    e.preventDefault();
    clearError();
    var problem = validate();
    if (problem) { showError(problem); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting…";
    fetch(API_BASE_URL + "/api/v1/public/apply", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(buildPayload())
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error("Request failed (" + resp.status + ")");
        showConfirmation();
      })
      .catch(function () { showError("We couldn't submit your request. Please try again in a moment."); })
      .finally(function () { submitBtn.disabled = false; submitBtn.textContent = def.submitLabel; });
  }

  // ── confirmation (+ GiveButter donation box for "someone else" only) ────
  function showConfirmation() {
    form.hidden = true;
    confirmEl.appendChild(el("div", "lotv-emoji", "💕"));
    confirmEl.appendChild(el("h2", null, def.confirmation.title));
    confirmEl.appendChild(el("p", null, def.confirmation.body));

    var d = def.donation;
    if (forWho === "someone" && d && d.enabled && /^[A-Za-z0-9]+$/.test(d.widgetId || "") && /^[A-Za-z0-9]+$/.test(d.account || "")) {
      var box = el("div", "lotv-donation");
      box.style.cssText = "text-align:left;margin-top:28px;";
      box.appendChild(el("h3", null, d.title));
      box.appendChild(el("p", null, d.body));
      var holder = el("div"); holder.id = "lotv-givebutter-widget";
      if (!document.getElementById("givebutter-widget-library-js")) {
        var s = document.createElement("script");
        s.async = true; s.id = "givebutter-widget-library-js";
        s.src = "https://widgets.givebutter.com/latest.umd.cjs?acct=" + d.account + "&p=wordpress";
        holder.appendChild(s);
      }
      var gb = document.createElement("givebutter-widget");
      gb.id = d.widgetId;
      if (d.amount && /^\d+$/.test(d.amount)) gb.setAttribute("amount", d.amount);
      holder.appendChild(gb);
      box.appendChild(holder);
      confirmEl.appendChild(box);
      pollWidenGiveButter(20);
    }
    confirmEl.hidden = false;
    postHeight();
  }

  // GiveButter hardcodes a 440px max-width on a nested element inside its
  // shadow DOM; poll for it after the widget script mounts and widen it to fill
  // the box. Fragile by nature - if GiveButter restructures, this silently
  // no-ops and the widget still renders at its default width.
  function pollWidenGiveButter(attemptsLeft) {
    var host = document.querySelector("#lotv-givebutter-widget givebutter-widget");
    var inner = host && host.shadowRoot && host.shadowRoot.querySelector("givebutter-giving-form");
    if (inner) {
      host.style.display = "block"; host.style.width = "100%";
      inner.setAttribute("max-width", "100%"); inner.style.maxWidth = "100%"; inner.style.width = "100%";
      postHeight();
      return;
    }
    if (attemptsLeft > 0) setTimeout(function () { pollWidenGiveButter(attemptsLeft - 1); }, 300);
  }
})();
</script>
