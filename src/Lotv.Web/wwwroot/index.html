<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOTV Ministry — Staff Portal</title>
    <base href="/" />
    <link rel="stylesheet" href="css/lotv-admin.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Lotv.Web.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
      window.downloadCsv = function (filename, content) {
        var bom = '\uFEFF';
        var blob = new Blob([bom + content], { type: 'text/csv;charset=utf-8;' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = filename;
        document.body.appendChild(a); a.click();
        document.body.removeChild(a); URL.revokeObjectURL(url);
      };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
