server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Serve Blazor WASM — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed static assets
    location ~* \.(js|css|wasm|dll|dat|blat|json|ico|png|svg|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell (browser always re-fetches to pick up new hashes)
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Enable Brotli/gzip pre-compressed Blazor assets
    gzip_static on;

    # Security headers for the frontend
    add_header X-Content-Type-Options  "nosniff"                     always;
    add_header X-Frame-Options         "DENY"                         always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
}
