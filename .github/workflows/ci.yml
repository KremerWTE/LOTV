name: CI — Build & Test

on:
  pull_request:
    branches: [main, stage]
  push:
    branches: [main, stage]

# Dependabot- and fork-triggered pull_request runs get a read-only GITHUB_TOKEN
# by default; the "Add coverage comment to PR" step needs write access to post
# its comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # ubuntu-latest ships ~30GB of preinstalled toolchains we don't use
      # (Android SDK, GHC, Swift, CodeQL bundle) on top of its already-tight
      # ~14GB free disk. The restore/build/publish x2/Playwright/test/E2E
      # pipeline below runs out of space without this — "No space left on
      # device" failures during Worker startup, incl. on Dependabot PR runs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/share/swift \
                      /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Lotv.slnx

      - name: Build
        run: dotnet build Lotv.slnx --no-restore --configuration Release

      # dotnet publish runs a stricter Razor component check than dotnet build —
      # e.g. RZ9985 (ambiguous same-named components across namespaces) only
      # fails here, not above. This is the cheapest way to catch a build that
      # passes CI but fails publish without needing Docker-in-CI for every PR.
      - name: Publish (catches dotnet-publish-only failures, e.g. RZ9985)
        run: |
          dotnet publish src/Lotv.Api/Lotv.Api.csproj --no-restore --configuration Release -o /tmp/publish-api
          dotnet publish src/Lotv.Web/Lotv.Web.csproj --no-restore --configuration Release -o /tmp/publish-web

      # coverlet.runsettings excludes EF Core's generated migrations/model
      # snapshot from coverage - mechanically generated DDL, not meant to be
      # unit-tested, but without this exclusion it swamps Lotv.Api's line
      # count (~90k generated lines, all 0% covered) and reports a
      # misleadingly low ~5% instead of the real ~47%.
      - name: Unit/integration tests with coverage
        run: |
          dotnet test tests/Lotv.Tests/Lotv.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            --settings tests/Lotv.Tests/coverlet.runsettings

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: xUnit Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: '**/coverage.cobertura.xml'
          badge: true
          format: markdown
          output: both
          thresholds: '60 80'

      - name: Add coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@v3
        # Dependabot-triggered pull_request runs always get a read-only
        # GITHUB_TOKEN — GitHub enforces this regardless of the `permissions:`
        # block above — so this step can never succeed there. Skip it rather
        # than fail the whole job over a missing comment.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          recreate: true
          path: code-coverage-results.md
