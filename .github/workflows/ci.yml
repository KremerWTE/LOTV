name: CI — Build & Test

on:
  pull_request:
    branches: [main, kremer-dev]
  push:
    branches: [main]

# Dependabot- and fork-triggered pull_request runs get a read-only GITHUB_TOKEN
# by default; the "Add coverage comment to PR" step needs write access to post
# its comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Lotv.slnx

      - name: Build
        run: dotnet build Lotv.slnx --no-restore --configuration Release

      - name: Install Playwright browsers
        run: pwsh tests/Lotv.E2E/bin/Release/net9.0/playwright.ps1 install --with-deps chromium

      - name: Start API and Web for E2E tests
        # Web's HttpClient is hardcoded to http://localhost:5275 (see src/Lotv.Web/Program.cs),
        # so the API must run on that exact port for the Web app's API calls to work.
        run: |
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5275 \
            nohup dotnet run --no-build --no-launch-profile --project src/Lotv.Api --configuration Release \
            > api.log 2>&1 &
          ASPNETCORE_ENVIRONMENT=Development ASPNETCORE_URLS=http://localhost:5001 \
            nohup dotnet run --no-build --no-launch-profile --project src/Lotv.Web --configuration Release \
            > web.log 2>&1 &
          echo "Waiting for API on :5275..."
          timeout 60 bash -c 'until curl -sf http://localhost:5275/health >/dev/null; do sleep 1; done' || (cat api.log; exit 1)
          echo "Waiting for Web on :5001..."
          timeout 60 bash -c 'until curl -sf http://localhost:5001/ >/dev/null; do sleep 1; done' || (cat web.log; exit 1)
        env:
          ConnectionStrings__DefaultConnection: "Data Source=/tmp/lotv-e2e.db"
          Jwt__Key: "LOTVTestSecretKeyThatIsLongEnoughForHS256Testing2026!"
          Jwt__Issuer: "lotv-e2e"
          Jwt__Audience: "lotv-e2e"

      - name: Unit/integration tests with coverage
        run: |
          dotnet test tests/Lotv.Tests/Lotv.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            --collect "XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      # No --collect here: coverage of the E2E project's own test methods isn't a
      # meaningful metric (they drive a browser, they don't exercise app code
      # in-process), and its near-empty cobertura file previously crashed the
      # Coverage summary step's parser when picked up by the **/ glob below.
      - name: E2E tests
        run: |
          dotnet test tests/Lotv.E2E/Lotv.E2E.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx"
        env:
          E2E_BASE_URL: http://localhost:5001
          E2E_API_URL: http://localhost:5275

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: '**/coverage.cobertura.xml'

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: '**/coverage.cobertura.xml'
          badge: true
          format: markdown
          output: both
          thresholds: '60 80'

      - name: Add coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        # Dependabot-triggered pull_request runs always get a read-only
        # GITHUB_TOKEN — GitHub enforces this regardless of the `permissions:`
        # block above — so this step can never succeed there. Skip it rather
        # than fail the whole job over a missing comment.
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        with:
          recreate: true
          path: code-coverage-results.md
