name: CI — Build & Test

on:
  pull_request:
    branches: [stage]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Lotv.slnx

      - name: Build
        run: dotnet build Lotv.slnx --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test tests/Lotv.Tests/Lotv.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: Unit Test Results
          path: '**/test-results.trx'
          reporter: dotnet-trx

  notify:
    name: Notify
    needs: build-and-test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Send CI notification email
        shell: bash
        env:
          RESULT:     ${{ needs.build-and-test.result }}
          FROM_ADDR:  ${{ secrets.NOTIFICATION_EMAIL_FROM }}
          TO_ADDR:    ${{ secrets.NOTIFICATION_EMAIL_RECIPIENTS }}
          SMTP_USER:  ${{ secrets.NOTIFICATION_EMAIL_USERNAME }}
          SMTP_PASS:  ${{ secrets.NOTIFICATION_EMAIL_PASSWORD }}
          SMTP_SRV:   ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:  ${{ secrets.SMTP_PORT }}
        run: |
          if [ "$RESULT" == "success" ]; then
            STATUS="✅ PASSED"
          else
            STATUS="❌ FAILED"
          fi

          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EVENT="${{ github.event_name }}"
          REF="${{ github.ref_name }}"
          ACTOR="${{ github.actor }}"

          printf 'From: "LOTV CI" <%s>\r\n' "$FROM_ADDR"          > email.txt
          printf 'To: %s\r\n' "$TO_ADDR"                          >> email.txt
          printf 'Subject: %s LOTV CI — %s (%s)\r\n' "$STATUS" "$REF" "$SHORT_SHA" >> email.txt
          printf 'MIME-Version: 1.0\r\nContent-Type: text/plain; charset=UTF-8\r\n\r\n' >> email.txt
          printf 'LOTV CI Build %s\r\n\r\n' "$STATUS"             >> email.txt
          printf 'Branch:  %s\r\n' "$REF"                         >> email.txt
          printf 'Commit:  %s\r\n' "$SHORT_SHA"                   >> email.txt
          printf 'Event:   %s\r\n' "$EVENT"                       >> email.txt
          printf 'Actor:   %s\r\n' "$ACTOR"                       >> email.txt
          printf 'Details: %s\r\n' "$RUN_URL"                     >> email.txt

          RCPT_FLAGS=""
          IFS=',' read -ra RECIPIENTS <<< "$TO_ADDR"
          for r in "${RECIPIENTS[@]}"; do
            r=$(echo "$r" | xargs)
            RCPT_FLAGS="$RCPT_FLAGS --mail-rcpt $r"
          done

          curl --url "smtp://${SMTP_SRV}:${SMTP_PORT}" \
            --ssl-reqd \
            --mail-from "$FROM_ADDR" \
            $RCPT_FLAGS \
            --user "$SMTP_USER:$SMTP_PASS" \
            --upload-file email.txt || true
        continue-on-error: true
