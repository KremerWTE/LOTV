# DISABLED 2026-09-14 — Azure staging environment does not exist; superseded
# by deploy-to-iis.yml which deploys to IIS on wte_apps3.
# To re-enable: restore the `on:` trigger and update secrets/environment refs.
name: Deploy — Staging

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE to run (workflow is disabled)"
        required: true

jobs:
  deploy-staging:
    name: Publish & Deploy → Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests (gate)
        run: dotnet test Lotv.slnx --configuration Release --no-restore

      # Database migrations are intentionally NOT run by this workflow (removed 2026-09-23);
      # schema changes are applied out-of-band. See deploy-to-iis.yml for the live pipeline.

      # No Docker: publish each project as plain framework-dependent output
      # and zip-deploy straight to App Service. Web is Blazor Server now (not
      # WASM), so it's a normal Kestrel app just like the API - both run on
      # a Linux App Service plan, no IIS/web.config/static-hosting needed.
      - name: Publish API
        run: dotnet publish src/Lotv.Api/Lotv.Api.csproj --configuration Release --no-build -o publish/api

      - name: Publish Web
        run: dotnet publish src/Lotv.Web/Lotv.Web.csproj --configuration Release --no-build -o publish/web

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_API_NAME }}
          package: publish/api

      - name: Deploy Web to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_WEB_NAME }}
          package: publish/web

      # See the matching comment in deploy-production.yml - zip-deploy only
      # ships code, the App Service still needs its own runtime Application
      # Settings (DB connection, JWT signing key, SMTP, CORS).
      - name: Configure API App Service settings (staging)
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.AZURE_WEBAPP_API_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              ConnectionStrings__DefaultConnection="${{ secrets.DB_CONNECTION_STRING }}" \
              Database__Provider="SqlServer" \
              Jwt__Key="${{ secrets.JWT_SIGNING_KEY }}" \
              Smtp__Host="${{ secrets.SMTP_SERVER }}" \
              Smtp__Port="${{ secrets.SMTP_PORT }}" \
              Smtp__Username="${{ secrets.SMTP_USERNAME }}" \
              Smtp__Password="${{ secrets.SMTP_PASSWORD }}" \
              Smtp__FromEmail="${{ secrets.NOTIFICATION_EMAIL_FROM }}" \
              Notifications__IntakeTeamEmails="${{ secrets.NOTIFICATION_EMAIL_RECIPIENTS }}" \
              AllowedOrigins__0="${{ vars.DUDA_SITE_ORIGIN }}"

      - name: Configure Web App Service settings (staging)
        run: |
          az webapp config appsettings set \
            --name ${{ secrets.AZURE_WEBAPP_WEB_NAME }} \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --settings \
              ApiBaseUrl="https://${{ secrets.AZURE_WEBAPP_API_NAME }}.azurewebsites.net"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Staging deploy failed for commit ${{ github.sha }}"
          # wire to Slack/email/PagerDuty here
