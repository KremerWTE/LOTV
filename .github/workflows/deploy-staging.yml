name: Deploy — Staging

# Disabled from auto-run on push: this repo has no staging environment yet
# (DB_CONNECTION_STRING / REGISTRY_HOST / REGISTRY_USER / REGISTRY_PASSWORD
# secrets aren't set). Trigger manually once those exist, or restore the
# `push: branches: [main]` trigger below.
on:
  workflow_dispatch: {}

jobs:
  deploy-staging:
    name: Build & Push Docker images → Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run tests (gate)
        run: dotnet test Lotv.slnx --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Run database migrations (staging)
        run: dotnet ef database update --project src/Lotv.Api --startup-project src/Lotv.Api --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Staging
          ConnectionStrings__Default: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set image tag
        id: tag
        run: echo "TAG=${{ secrets.REGISTRY_HOST }}/lotv:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Lotv.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/lotv-api:staging
            ${{ secrets.REGISTRY_HOST }}/lotv-api:${{ github.sha }}

      - name: Build & push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Lotv.Web/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/lotv-web:staging
            ${{ secrets.REGISTRY_HOST }}/lotv-web:${{ github.sha }}

      # ── Deploy step: swap for your actual hosting (Azure / Railway / etc.) ──
      # Example: Azure Container Apps
      # - name: Deploy API to staging
      #   uses: azure/container-apps-deploy-action@v1
      #   with:
      #     appSourcePath: ${{ github.workspace }}
      #     acrName: ${{ secrets.ACR_NAME }}
      #     containerAppName: lotv-api-staging
      #     resourceGroup: ${{ secrets.AZURE_RG }}
      #     imageToDeploy: ${{ secrets.REGISTRY_HOST }}/lotv-api:${{ github.sha }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "Staging deploy failed for commit ${{ github.sha }}"
          # wire to Slack/email/PagerDuty here
