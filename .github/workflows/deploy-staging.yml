name: Deploy — Staging

# Disabled from auto-run on push: this repo has no staging environment yet
# (DB_CONNECTION_STRING / Azure secrets aren't set). Trigger manually once
# those exist, or restore the `push: branches: [main]` trigger below.
on:
  workflow_dispatch: {}

jobs:
  deploy-staging:
    name: Publish & Deploy → Staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run tests (gate)
        run: dotnet test Lotv.slnx --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      # Must build this explicitly, in this order, before the migrations step:
      # Lotv.Api's UseSqlServer(...) loads this assembly by name at runtime
      # (Assembly.Load), and a ProjectReference back from Lotv.Api would be
      # circular (this project already references Lotv.Api for the
      # DbContext). Lotv.Api's post-build target copies this DLL into its own
      # output once it exists on disk - but only if it already exists when
      # Lotv.Api itself gets (re)built by the `dotnet ef` command below.
      - name: Build SQL Server migrations assembly
        run: dotnet build src/Lotv.Migrations.SqlServer/Lotv.Migrations.SqlServer.csproj --configuration Release

      - name: Run database migrations (staging)
        run: dotnet ef database update --project src/Lotv.Api --startup-project src/Lotv.Api --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Staging
          Database__Provider: SqlServer
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

      # No Docker: publish each project as plain framework-dependent output
      # and zip-deploy straight to App Service. Web is Blazor Server now (not
      # WASM), so it's a normal Kestrel app just like the API - both run on
      # a Linux App Service plan, no IIS/web.config/static-hosting needed.
      - name: Publish API
        run: dotnet publish src/Lotv.Api/Lotv.Api.csproj --configuration Release --no-build -o publish/api

      - name: Publish Web
        run: dotnet publish src/Lotv.Web/Lotv.Web.csproj --configuration Release --no-build -o publish/web

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_API_NAME }}
          package: publish/api

      - name: Deploy Web to Azure App Service (staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_WEB_NAME }}
          package: publish/web

      - name: Notify on failure
        if: failure()
        run: |
          echo "Staging deploy failed for commit ${{ github.sha }}"
          # wire to Slack/email/PagerDuty here
