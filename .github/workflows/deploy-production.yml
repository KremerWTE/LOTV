name: Deploy — Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # triggers on v1.0.0, v1.2.3, etc.

jobs:
  deploy-production:
    name: Deploy release tag to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run tests (gate)
        run: dotnet test Lotv.slnx --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      - name: Run database migrations (production)
        run: dotnet ef database update --project src/Lotv.Api --startup-project src/Lotv.Api --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Database__Provider: SqlServer
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Extract release version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & push API image (production tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Lotv.Api/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/lotv-api:production
            ${{ secrets.REGISTRY_HOST }}/lotv-api:${{ steps.version.outputs.VERSION }}

      - name: Build & push Web image (production tag)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Lotv.Web/Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/lotv-web:production
            ${{ secrets.REGISTRY_HOST }}/lotv-web:${{ steps.version.outputs.VERSION }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_API_NAME_PROD }}
          images: ${{ secrets.REGISTRY_HOST }}/lotv-api:${{ steps.version.outputs.VERSION }}

      - name: Deploy Web to Azure App Service (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_WEB_NAME_PROD }}
          images: ${{ secrets.REGISTRY_HOST }}/lotv-web:${{ steps.version.outputs.VERSION }}

      - name: Create GitHub Release notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deploy FAILED for ${{ steps.version.outputs.VERSION }}"
          # wire to on-call / PagerDuty here
