name: Deploy — Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # triggers on v1.0.0, v1.2.3, etc.

jobs:
  deploy-production:
    name: Publish & Deploy release tag → Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Run tests (gate)
        run: dotnet test Lotv.slnx --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 9.*

      # See the matching comment in deploy-staging.yml - this must build
      # before the migrations step so Lotv.Api's post-build copy target has
      # something to copy when `dotnet ef` rebuilds it below.
      - name: Build SQL Server migrations assembly
        run: dotnet build src/Lotv.Migrations.SqlServer/Lotv.Migrations.SqlServer.csproj --configuration Release

      - name: Run database migrations (production)
        run: dotnet ef database update --project src/Lotv.Api --startup-project src/Lotv.Api --configuration Release
        env:
          ASPNETCORE_ENVIRONMENT: Production
          Database__Provider: SqlServer
          ConnectionStrings__DefaultConnection: ${{ secrets.DB_CONNECTION_STRING }}

      - name: Extract release version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # No Docker: publish each project as plain framework-dependent output
      # and zip-deploy straight to App Service. The Web project (Blazor
      # WASM) needs a Windows App Service plan - `dotnet publish` on this
      # SDK auto-generates a web.config with the SPA fallback rewrite rule
      # into publish/wwwroot, which IIS on a Windows plan honors natively;
      # a Linux plan has no server component to serve the static output.
      - name: Publish API
        run: dotnet publish src/Lotv.Api/Lotv.Api.csproj --configuration Release --no-build -o publish/api

      - name: Publish Web
        run: dotnet publish src/Lotv.Web/Lotv.Web.csproj --configuration Release --no-build -o publish/web

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure App Service (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_API_NAME_PROD }}
          package: publish/api

      - name: Deploy Web to Azure App Service (production)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_WEB_NAME_PROD }}
          package: publish/web

      - name: Create GitHub Release notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true

      - name: Notify on failure
        if: failure()
        run: |
          echo "Production deploy FAILED for ${{ steps.version.outputs.VERSION }}"
          # wire to on-call / PagerDuty here
