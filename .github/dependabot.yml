# Disabled 2026-09-14 — NuGet vulnerability overrides are managed manually
# in project csproj files; Dependabot PRs were creating noise without benefit.
# Re-enable by restoring the `updates:` block below.
version: 2
updates: []
# updates:
#   # .NET NuGet packages
#   - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - dotnet
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "System.*"
      entityframework:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      serilog:
        patterns:
          - "Serilog*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
